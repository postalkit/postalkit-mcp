# Smithery configuration: https://smithery.ai/docs/config
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - postalkitKey
    properties:
      postalkitKey:
        type: string
        description: Your PostalKit API key. Get a free one (100 requests/month) at https://postalkit.mx/register
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'postalkit-mcp'],
      env: { POSTALKIT_KEY: config.postalkitKey }
    })
  exampleConfig:
    postalkitKey: your-postalkit-api-key
